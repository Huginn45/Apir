name: Build Apir Mobile APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apir_mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Apir Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apir-mobile-release-apk
          path: apir_mobile/build/app/outputs/flutter-apk/app-release.apk
