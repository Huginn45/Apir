name: apir_mobile
description: Apir (Adaptive Presentation Interface & Remote) — QR Pairing Edition wireless presenter controller.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^5.2.3
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/apir_logo.png

  # Uncomment the fonts section below once Tribo and Garet (.otf/.ttf) files
  # are placed inside `apir_mobile/assets/fonts/`. Until then, `ThemeData` in
  # `lib/main.dart` automatically uses the configured `Montserrat` / `Plus Jakarta Sans` fallback.
  # fonts:
  #   - family: Tribo
  #     fonts:
  #       - asset: assets/fonts/Tribo-Regular.otf
  #       - asset: assets/fonts/Tribo-Regular.ttf
  #   - family: Garet
  #     fonts:
  #       - asset: assets/fonts/Garet-Book.otf
  #         weight: 400
  #       - asset: assets/fonts/Garet-Book.ttf
  #         weight: 400
  #       - asset: assets/fonts/Garet-Heavy.otf
  #         weight: 700
  #       - asset: assets/fonts/Garet-Heavy.ttf
  #         weight: 700
